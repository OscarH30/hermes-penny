name: penny
version: 1.2.1
description: "Bookkeeper — learns your chart of accounts, categorizes uncategorized transactions in QuickBooks or Xero, books receipts from a photo, and asks about anything it isn't sure of. Nothing posts without your approval."
hermes_requires: ">=0.20.0"
author: "Vindex Consulting"
license: "MIT"

# What the distribution owns. Everything else in the profile — brain/, memories,
# sessions, .env, auth.json, databases — belongs to the installer and is never
# touched by `hermes profile update`.
#
# Note what is deliberately ABSENT from this list: mcp.json and the mcp_servers
# block in config.yaml. Those hold the tools onboarding wired to this profile,
# and an update must never be able to unwire a configured agent. Skills, SOUL,
# and cron improve; access stays exactly as the owner granted it.
distribution_owned:
  - SOUL.md
  - config.yaml
  - skills/
  - cron/
  - scripts/
  - README.md
  - .env.template
  - distribution.yaml


# NOTHING HERE IS REQUIRED TO INSTALL OR START.
#
# Penny arrives with no tool access at all. Her onboarding skill connects your
# books and wires them to this profile — Composio (recommended), your own Intuit
# or Xero credentials, or an MCP server you already run. These variables only
# apply if you pick the direct-credential route.
env_requires:
  - name: COMPOSIO_API_KEY
    description: "Composio API key — the recommended path for QuickBooks and Xero. Free at composio.dev. Onboarding walks you through it."
    required: false
    default: ""
  - name: QBO_CLIENT_ID
    description: "QuickBooks Online app client ID — only if you are NOT using Composio. Requires creating an Intuit developer app."
    required: false
    default: ""
  - name: QBO_CLIENT_SECRET
    description: "QuickBooks Online app client secret — pairs with QBO_CLIENT_ID."
    required: false
    default: ""
  - name: QBO_REALM_ID
    description: "Your QuickBooks company (realm) ID."
    required: false
    default: ""
  - name: XERO_CLIENT_ID
    description: "Xero app client ID — only if you use Xero and are NOT using Composio."
    required: false
    default: ""
  - name: XERO_CLIENT_SECRET
    description: "Xero app client secret — pairs with XERO_CLIENT_ID."
    required: false
    default: ""
  - name: PENNY_RECEIPT_EMAIL
    description: "Optional inbox Penny watches for forwarded receipts (e.g. receipts@yourdomain.com). Telegram photos work without this."
    required: false
    default: ""
